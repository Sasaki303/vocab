<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>単語帳 401〜440</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: #dceffa;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color: #1a2a3a;
  }
  .wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 18px 16px 40px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  h1 {
    text-align: center;
    font-size: 20px;
    margin: 6px 0 16px;
    color: #14568c;
  }

  /* モード切り替え */
  .modes {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .mode-btn {
    flex: 1;
    padding: 12px 6px;
    font-size: 15px;
    font-weight: 700;
    border: 2px solid #3f8fd0;
    background: #ffffff;
    color: #3f8fd0;
    border-radius: 12px;
    cursor: pointer;
  }
  .mode-btn.active {
    background: #3f8fd0;
    color: #ffffff;
  }

  /* カード */
  .card {
    background: #ffffff;
    border-radius: 22px;
    box-shadow: 0 6px 18px rgba(20,86,140,0.15);
    padding: 30px 22px;
    min-height: 240px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    cursor: pointer;
    user-select: none;
    position: relative;
  }
  .no-badge {
    position: absolute;
    top: 14px;
    left: 16px;
    font-size: 13px;
    font-weight: 700;
    color: #8aa7bd;
  }
  .front-text {
    font-size: 30px;
    font-weight: 700;
    line-height: 1.35;
    word-break: break-word;
  }
  .answer {
    margin-top: 22px;
    padding-top: 20px;
    border-top: 1px dashed #d0dbe4;
    width: 100%;
    font-size: 24px;
    font-weight: 700;
    color: #d5352b;
    line-height: 1.5;
    word-break: break-word;
    display: none;
  }
  .answer.show { display: block; }
  .tap-hint {
    margin-top: 20px;
    font-size: 13px;
    color: #a7bccc;
  }
  .tap-hint.hide { visibility: hidden; }

  /* 位置表示 */
  .pos {
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    color: #14568c;
    margin: 18px 0 14px;
  }

  /* 操作ボタン */
  .nav {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }
  .nav-btn {
    flex: 1;
    padding: 16px 6px;
    font-size: 17px;
    font-weight: 700;
    border: none;
    background: #3f8fd0;
    color: #ffffff;
    border-radius: 14px;
    cursor: pointer;
  }
  .nav-btn:active { background: #2f76b0; }

  .shuffle-btn {
    padding: 14px 6px;
    font-size: 15px;
    font-weight: 700;
    border: 2px solid #3f8fd0;
    background: #ffffff;
    color: #3f8fd0;
    border-radius: 14px;
    cursor: pointer;
  }
  .shuffle-btn.active {
    background: #14568c;
    border-color: #14568c;
    color: #ffffff;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>英単語 401〜440</h1>

  <div class="modes">
    <button class="mode-btn active" id="modeEJ">英語 → 日本語</button>
    <button class="mode-btn" id="modeJE">日本語 → 英語</button>
  </div>

  <div class="card" id="card">
    <div class="no-badge" id="noBadge">No.401</div>
    <div class="front-text" id="frontText">demonstrate</div>
    <div class="answer" id="answerText"></div>
    <div class="tap-hint" id="tapHint">タップで答えを表示</div>
  </div>

  <div class="pos" id="pos">1 / 40</div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn">前へ</button>
    <button class="nav-btn" id="nextBtn">次へ</button>
  </div>
  <button class="shuffle-btn" id="shuffleBtn">🔀 シャッフル</button>
</div>

<script>
  // 単語データ（番号・英語・日本語）
  const WORDS = [
    { no: 401, en: "demonstrate", ja: "を論証[証明]する；デモをする" },
    { no: 402, en: "behave", ja: "振る舞う；作動する" },
    { no: 403, en: "educate", ja: "を教育する；に教える" },
    { no: 404, en: "purchase", ja: "を購入する" },
    { no: 405, en: "recommend", ja: "を勧める" },
    { no: 406, en: "admit", ja: "(を)(しぶしぶ)認める" },
    { no: 407, en: "generate", ja: "を生み出す；(電気など)を発生させる" },
    { no: 408, en: "explore", ja: "(を)調査[探究]する；(を)探検する" },
    { no: 409, en: "amaze", ja: "をびっくりさせる" },
    { no: 410, en: "tear", ja: "を引き裂く；裂ける" },
    { no: 411, en: "settle", ja: "を解決する；(に)移り住む；を落ち着かせる" },
    { no: 412, en: "afford", ja: "を持つ[する]余裕がある；を与える" },
    { no: 413, en: "conclude", ja: "と結論づける；を締めくくる" },
    { no: 414, en: "advertise", ja: "を宣伝する；広告を出す" },
    { no: 415, en: "encounter", ja: "に遭遇する；に(思いがけず)出会う" },
    { no: 416, en: "remind", ja: "に思い出させる" },
    { no: 417, en: "locate", ja: "〔受身形で〕位置する；の位置を探し当てる" },
    { no: 418, en: "aid", ja: "を援助する，助ける" },
    { no: 419, en: "bite", ja: "(を)かむ，(に)かみつく；(を)刺す" },
    { no: 420, en: "deliver", ja: "を配達する；(演説・講義)をする；子を産む" },
    { no: 421, en: "perceive", ja: "に気づく；を知覚する；を理解する" },
    { no: 422, en: "distinguish", ja: "を区別する" },
    { no: 423, en: "imply", ja: "を暗に意味する；を必然的に伴う" },
    { no: 424, en: "handle", ja: "を処理する，扱う；を論じる；を商う" },
    { no: 425, en: "praise", ja: "を賞賛する；賛美する" },
    { no: 426, en: "appeal", ja: "訴える；抗議する；(上級審に)上訴する" },
    { no: 427, en: "insist", ja: "(を)強く主張する；要求する" },
    { no: 428, en: "compete", ja: "競う；(に)匹敵する" },
    { no: 429, en: "rank", ja: "を位置づける，評価する；(ある地位に)位置する" },
    { no: 430, en: "deny", ja: "を否定する；を拒む" },
    { no: 431, en: "reject", ja: "を拒否する" },
    { no: 432, en: "intend", ja: "を意図する" },
    { no: 433, en: "expose", ja: "をさらす；を暴露する；を露出する" },
    { no: 434, en: "favor", ja: "に賛成する；を好む；をひいきする" },
    { no: 435, en: "inspire", ja: "(人)を奮起させる；を喚起する" },
    { no: 436, en: "propose", ja: "を提案する；をもくろむ；結婚を申し込む" },
    { no: 437, en: "spell", ja: "(語)をつづる；という語になる" },
    { no: 438, en: "breathe", ja: "呼吸する；を吸う" },
    { no: 439, en: "repair", ja: "を修理する；を修復する" },
    { no: 440, en: "consist", ja: "(~から)成る(of)；(~に)ある(in)" }
  ];

  let order = WORDS.map((_, i) => i); // 表示順（インデックス配列）
  let cur = 0;            // order 上の現在位置
  let mode = "EJ";        // "EJ" = 英→日, "JE" = 日→英
  let flipped = false;    // 答えを表示中か
  let shuffled = false;   // シャッフル中か

  const card = document.getElementById("card");
  const noBadge = document.getElementById("noBadge");
  const frontText = document.getElementById("frontText");
  const answerText = document.getElementById("answerText");
  const tapHint = document.getElementById("tapHint");
  const pos = document.getElementById("pos");
  const modeEJ = document.getElementById("modeEJ");
  const modeJE = document.getElementById("modeJE");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const shuffleBtn = document.getElementById("shuffleBtn");

  function render() {
    const w = WORDS[order[cur]];
    noBadge.textContent = "No." + w.no;
    if (mode === "EJ") {
      frontText.textContent = w.en;
      answerText.textContent = w.ja;
      frontText.style.fontSize = "30px";
    } else {
      frontText.textContent = w.ja;
      answerText.textContent = w.en;
      frontText.style.fontSize = "24px";
    }
    flipped = false;
    answerText.classList.remove("show");
    tapHint.classList.remove("hide");
    pos.textContent = (cur + 1) + " / " + order.length;
  }

  function flip() {
    flipped = !flipped;
    if (flipped) {
      answerText.classList.add("show");
      tapHint.classList.add("hide");
    } else {
      answerText.classList.remove("show");
      tapHint.classList.remove("hide");
    }
  }

  function next() {
    cur = (cur + 1) % order.length;
    render();
  }
  function prev() {
    cur = (cur - 1 + order.length) % order.length;
    render();
  }

  function setMode(m) {
    mode = m;
    modeEJ.classList.toggle("active", m === "EJ");
    modeJE.classList.toggle("active", m === "JE");
    render();
  }

  function toggleShuffle() {
    if (!shuffled) {
      // シャッフル
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      shuffled = true;
      shuffleBtn.classList.add("active");
      shuffleBtn.textContent = "↩︎ 番号順に戻す";
    } else {
      // 元の番号順に戻す
      order = WORDS.map((_, i) => i);
      shuffled = false;
      shuffleBtn.classList.remove("active");
      shuffleBtn.textContent = "🔀 シャッフル";
    }
    cur = 0;
    render();
  }

  card.addEventListener("click", flip);
  nextBtn.addEventListener("click", next);
  prevBtn.addEventListener("click", prev);
  modeEJ.addEventListener("click", () => setMode("EJ"));
  modeJE.addEventListener("click", () => setMode("JE"));
  shuffleBtn.addEventListener("click", toggleShuffle);

  render();
</script>
</body>
</html>
